[workspace]
members = [
    "crates/core",
    "crates/worker-cf",
    "crates/worker-lambda",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Squads Multisig Program v4 transaction monitoring tool"
license-file = "LICENSE"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
