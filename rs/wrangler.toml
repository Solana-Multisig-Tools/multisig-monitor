name = "multisig-monitor"
main = "crates/worker-cf/build/worker/shim.mjs"
compatibility_date = "2024-09-25"

[build]
command = "cargo install -q worker-build && worker-build --release"
cwd = "crates/worker-cf"

[vars]
# Comma-separated Squads v4 multisig addresses to monitor
MULTISIG_ADDRESSES = ""

# Optional: comma-separated instruction types to alert on.
# If empty or omitted, all instruction types are monitored.
# Valid values: proposal_create, proposal_activate, proposal_approve,
#   proposal_reject, proposal_cancel, vault_transaction_create,
#   config_transaction_create, vault_transaction_execute, config_transaction_execute
INSTRUCTION_TYPES = ""

# Optional: comma-separated config action types to alert on.
# If empty or omitted, all config action types are included.
# Ignored if config_transaction_create is excluded from INSTRUCTION_TYPES.
# Valid values: add_member, remove_member, change_threshold,
#   set_time_lock, add_spending_limit, remove_spending_limit, set_rent_collector
CONFIG_TYPES = ""
SHOW_PERMISSIONS = ""
SHOW_TIMESTAMPS = ""
TRUNCATE_ADDRESSES = ""
LOG_LEVEL = ""

# Secrets (set via `wrangler secret put`):
# HELIUS_AUTH_TOKEN  — shared secret for webhook auth header validation
# SLACK_WEBHOOK_URL  — Slack incoming webhook endpoint
